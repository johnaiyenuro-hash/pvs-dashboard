<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="pinRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="50%" stop-color="#E60023"/>
      <stop offset="100%" stop-color="#B30018"/>
    </linearGradient>
    <linearGradient id="plateDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C2E"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="steelGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#E60023" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Concentric Ceramic Plate -->
  <circle cx="256" cy="256" r="226" stroke="#E60023" stroke-width="6" stroke-dasharray="14 10" opacity="0.35"/>
  <circle cx="256" cy="256" r="198" fill="url(#plateDark)" stroke="#1E293B" stroke-width="8"/>
  <circle cx="256" cy="256" r="144" fill="#0D1321" stroke="#334155" stroke-width="4" opacity="0.8"/>

  <!-- The ForkPin Core Symbol -->
  <g filter="url(#glow)">
    <!-- Pushpin Rounded Cap -->
    <circle cx="256" cy="128" r="64" fill="url(#pinRed)"/>
    <circle cx="256" cy="128" r="24" fill="#FFFFFF"/>
    
    <!-- Pin Neck Transition -->
    <path d="M 234,188 L 278,188 L 272,232 L 240,232 Z" fill="url(#steelGleam)"/>

    <!-- Culinary Fork Base Collar -->
    <path d="M 220,232 C 220,268 292,268 292,232 Z" fill="#FFFFFF"/>

    <!-- Fork 3 Tines Piercing Downward -->
    <!-- Left Tine -->
    <path d="M 224,244 L 224,354 C 224,374 234,390 240,400" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Center Tine (Long Needle Piercing Plate) -->
    <path d="M 256,236 L 256,426" stroke="url(#pinRed)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Right Tine -->
    <path d="M 288,244 L 288,354 C 288,374 278,390 272,400" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Needle Point Ceramic Impact Spark -->
    <circle cx="256" cy="426" r="7" fill="#FFFFFF"/>
  </g>
</svg>