<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626"/>
      <stop offset="50%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="pinRedIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="50%" stop-color="#E60023"/>
      <stop offset="100%" stop-color="#990014"/>
    </linearGradient>
    <linearGradient id="plateRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#E60023" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" stroke="#E60023" stroke-width="2" stroke-opacity="0.3" fill="none"/>

  <!-- Concentric Ceramic Plate -->
  <circle cx="256" cy="256" r="186" stroke="#E60023" stroke-width="4" stroke-dasharray="10 8" opacity="0.3"/>
  <circle cx="256" cy="256" r="162" fill="url(#plateRing)" stroke="#334155" stroke-width="6"/>
  <circle cx="256" cy="256" r="118" fill="#0A0F1D" stroke="#1E293B" stroke-width="3"/>

  <!-- The ForkPin Core Symbol -->
  <g filter="url(#iconGlow)">
    <!-- Pushpin Rounded Cap -->
    <circle cx="256" cy="144" r="54" fill="url(#pinRedIcon)"/>
    <circle cx="256" cy="144" r="20" fill="#FFFFFF"/>
    
    <!-- Pin Neck Transition -->
    <path d="M 238,194 L 274,194 L 269,232 L 243,232 Z" fill="#E2E8F0"/>

    <!-- Fork Base Collar -->
    <path d="M 224,232 C 224,264 288,264 288,232 Z" fill="#FFFFFF"/>

    <!-- Fork 3 Tines -->
    <path d="M 228,244 L 228,340 C 228,358 238,372 242,380" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 256,236 L 256,400" stroke="url(#pinRedIcon)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 284,244 L 284,340 C 284,358 274,372 270,380" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Plate Needle Point Spark -->
    <circle cx="256" cy="400" r="6" fill="#FFFFFF"/>
  </g>
</svg>