<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Brand Gradients v3 -->
    <linearGradient id="v3GlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1E56"/>
      <stop offset="50%" stop-color="#FF4B2B"/>
      <stop offset="100%" stop-color="#FF8008"/>
    </linearGradient>
    <linearGradient id="v3PlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182030"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>
    <linearGradient id="v3SteelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="v3Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#FF1E56" flood-opacity="0.5"/>
    </filter>
    <filter id="v3SoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Plate Ambient Halo -->
  <circle cx="256" cy="256" r="220" fill="url(#v3GlowGrad)" opacity="0.08" filter="url(#v3SoftGlow)"/>
  
  <!-- Outer Modern Ceramic Rim -->
  <circle cx="256" cy="256" r="224" stroke="url(#v3GlowGrad)" stroke-width="4" opacity="0.3" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="202" fill="url(#v3PlateGrad)" stroke="#1E293B" stroke-width="6"/>
  <circle cx="256" cy="256" r="150" fill="#0A0F1D" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Geometric Teardrop MapPin & Fork Fusion (v3 Crest) -->
  <g filter="url(#v3Shadow)">
    <!-- Sleek Outer Map Pin Shell -->
    <path d="M 256,72 C 182,72 122,132 122,206 C 122,286 230,396 256,432 C 282,396 390,286 390,206 C 390,132 330,72 256,72 Z" 
          fill="url(#v3GlowGrad)"/>

    <!-- Negative Space Cutout: Pure Ceramic Core Plate -->
    <circle cx="256" cy="204" r="76" fill="#0A0F1D"/>
    
    <!-- Inner Fine Plate Rim -->
    <circle cx="256" cy="204" r="62" stroke="#334155" stroke-width="2" fill="none" opacity="0.8"/>

    <!-- Integrated Minimalist Fork Cutlery in Negative Space -->
    <!-- Fork Neck & Handle -->
    <path d="M 250,140 L 262,140 L 260,204 L 252,204 Z" fill="url(#v3SteelGrad)"/>

    <!-- Fork Base Arc -->
    <path d="M 230,204 C 230,234 282,234 282,204" stroke="url(#v3SteelGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- 3 Precision Tines -->
    <!-- Left Tine -->
    <path d="M 230,198 L 230,154" stroke="url(#v3SteelGrad)" stroke-width="7" stroke-linecap="round"/>
    <!-- Center Tine (Focal Alignment) -->
    <path d="M 256,198 L 256,146" stroke="#FF8008" stroke-width="7" stroke-linecap="round"/>
    <!-- Right Tine -->
    <path d="M 282,198 L 282,154" stroke="url(#v3SteelGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Bottom Pin Point Impact Dot (Gourmet Destination) -->
    <circle cx="256" cy="432" r="6" fill="#FFFFFF"/>
    <circle cx="256" cy="432" r="14" stroke="#FF8008" stroke-width="3" fill="none" opacity="0.7"/>
  </g>
</svg>