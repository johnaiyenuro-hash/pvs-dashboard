<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Brand Gradients v2 -->
    <linearGradient id="v2PlateRim512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A55"/>
      <stop offset="60%" stop-color="#E60023"/>
      <stop offset="100%" stop-color="#FF5722"/>
    </linearGradient>
    <linearGradient id="v2Head512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B69"/>
      <stop offset="100%" stop-color="#B30018"/>
    </linearGradient>
    <linearGradient id="v2Steel512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="v2Glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#E60023" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Concentric Ceramic Plate -->
  <circle cx="256" cy="256" r="226" stroke="url(#v2PlateRim512)" stroke-width="6" stroke-dasharray="16 10" opacity="0.4"/>
  <circle cx="256" cy="256" r="198" fill="#070B14" stroke="#1E293B" stroke-width="8"/>
  <circle cx="256" cy="256" r="142" fill="#0D1424" stroke="#334155" stroke-width="4" opacity="0.7"/>

  <!-- Dynamic Velocity Speed Arc (1-Click Cart Flow) -->
  <path d="M 82,256 A 174,174 0 0,1 398,124" stroke="#FF5722" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- The ForkPin Core Symbol v2 -->
  <g filter="url(#v2Glow512)">
    <!-- Aerodynamic Pushpin Cap -->
    <circle cx="256" cy="120" r="66" fill="url(#v2Head512)"/>
    <circle cx="256" cy="120" r="26" fill="#FFFFFF"/>
    <circle cx="256" cy="120" r="12" fill="#E60023"/>
    
    <!-- Precision Tapered Neck -->
    <path d="M 232,182 L 280,182 L 274,228 L 238,228 Z" fill="url(#v2Steel512)"/>

    <!-- Sculpted Culinary Fork Collar -->
    <path d="M 218,228 C 218,266 294,266 294,228 Z" fill="#FFFFFF"/>

    <!-- Fork 3 Tines (Golden-Ratio Curvature) -->
    <!-- Left Tine: Ergonomic Inward Curve -->
    <path d="M 222,240 L 222,342 C 222,368 238,386 248,396" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>
    
    <!-- Center Tine: Needle Piercing Plate Target with Accent Color -->
    <path d="M 256,232 L 256,430" stroke="url(#v2PlateRim512)" stroke-width="15" stroke-linecap="round"/>
    
    <!-- Right Tine: Mirror Inward Curve -->
    <path d="M 290,240 L 290,342 C 290,368 274,386 264,396" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Plate Target Impact Shockwave -->
    <circle cx="256" cy="430" r="8" fill="#FFFFFF"/>
    <circle cx="256" cy="430" r="16" stroke="#FF5722" stroke-width="3" fill="none" opacity="0.6"/>
  </g>
</svg>